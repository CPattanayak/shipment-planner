# ─────────────────────────────────────────────────────────────────────────────
#  Official Apollo MCP Server configuration
#  Image: ghcr.io/apollographql/apollo-mcp-server
#
#  Each .graphql file in the operations/ directory becomes one MCP tool.
#  The tool name = the operation name inside the file.
#  Hot-reload: drop / edit files in operations/ and tools update immediately.
# ─────────────────────────────────────────────────────────────────────────────

# Where to load named GraphQL operation files from (hot-reloaded directory)
operations:
  source: local
  paths:
    - /mcp-operations/

# The composed supergraph schema (generated by Rover)
schema:
  source: local
  path: /supergraph/supergraph.graphql

# Apollo Router (Federation gateway) endpoint
endpoint: http://apollo-router:4000/graphql

# MCP transport – streamable HTTP (JSON-RPC 2.0 over HTTP)
transport:
  type: streamable_http
  address: 0.0.0.0
  port: 8000
  host_validation:
    enabled: false   # internal Docker network — no need for host validation

# Schema introspection / validation options
introspection:
  introspect:
    enabled: true
  search:
    enabled: true
  validate:
    enabled: true
  # Disable free-form execution so the LLM can only call the named operation
  # tools in /mcp-operations/.  Leaving this true lets the LLM generate
  # anonymous inline mutations (which Apollo Router rejects) and bypasses HITL.
  execute:
    enabled: false

# Headers forwarded from MCP caller → GraphQL endpoint
forward_headers:
  - Authorization
