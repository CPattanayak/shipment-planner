version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  Shipment Planner – Docker Compose
#  Services:
#    postgres         – single DB, 4 schemas (shipment / route / carrier / warehouse)
#    shipment-service – Spring Boot  :8081  GraphQL subgraph
#    route-service    – Spring Boot  :8082  GraphQL subgraph
#    carrier-service  – Spring Boot  :8083  GraphQL subgraph
#    warehouse-service– Spring Boot  :8084  GraphQL subgraph
#    apollo-router    – Federation router :4000
#    apollo-mcp-server– Official Apollo MCP Server :8090→8000
#    fastapi-mcp      – Prompt MCP Server (versioned system prompts) :8091
#    fastapi-gateway  – LangGraph + OpenRouter/Mistral FastAPI :8000
#    react-ui         – Vite React + Apollo Client (nginx) :3000
# ─────────────────────────────────────────────────────────────────────────────

x-spring-defaults: &spring-defaults
  restart: unless-stopped
  networks: [shipment-net]
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sp-postgres
    restart: unless-stopped
    networks: [shipment-net]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: shipment_planner
      POSTGRES_USER: sp_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-sp_admin_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sp_admin -d shipment_planner"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Shipment Service ────────────────────────────────────────────────────────
  shipment-service:
    <<: *spring-defaults
    build:
      context: .
      dockerfile: domain-services/shipment-service/Dockerfile
    container_name: sp-shipment
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shipment_planner?currentSchema=shipment
      SPRING_DATASOURCE_USERNAME: shipment_svc
      SPRING_DATASOURCE_PASSWORD: shipment_pass
      SPRING_FLYWAY_DEFAULT_SCHEMA: shipment
      SERVER_PORT: "8081"

  # ── Route Service ───────────────────────────────────────────────────────────
  route-service:
    <<: *spring-defaults
    build:
      context: .
      dockerfile: domain-services/route-service/Dockerfile
    container_name: sp-route
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shipment_planner?currentSchema=route
      SPRING_DATASOURCE_USERNAME: route_svc
      SPRING_DATASOURCE_PASSWORD: route_pass
      SPRING_FLYWAY_DEFAULT_SCHEMA: route
      SERVER_PORT: "8082"

  # ── Carrier Service ─────────────────────────────────────────────────────────
  carrier-service:
    <<: *spring-defaults
    build:
      context: .
      dockerfile: domain-services/carrier-service/Dockerfile
    container_name: sp-carrier
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shipment_planner?currentSchema=carrier
      SPRING_DATASOURCE_USERNAME: carrier_svc
      SPRING_DATASOURCE_PASSWORD: carrier_pass
      SPRING_FLYWAY_DEFAULT_SCHEMA: carrier
      SERVER_PORT: "8083"

  # ── Warehouse Service ───────────────────────────────────────────────────────
  warehouse-service:
    <<: *spring-defaults
    build:
      context: .
      dockerfile: domain-services/warehouse-service/Dockerfile
    container_name: sp-warehouse
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shipment_planner?currentSchema=warehouse
      SPRING_DATASOURCE_USERNAME: warehouse_svc
      SPRING_DATASOURCE_PASSWORD: warehouse_pass
      SPRING_FLYWAY_DEFAULT_SCHEMA: warehouse
      SERVER_PORT: "8084"

  # ── Apollo Router (Federation) ──────────────────────────────────────────────
  apollo-router:
    image: ghcr.io/apollographql/router:v1.47.0
    container_name: sp-router
    restart: unless-stopped
    networks: [shipment-net]
    ports:
      - "4000:4000"
    volumes:
      - ./apollo-federation/router.yaml:/dist/config/router.yaml:ro
      - ./apollo-federation/supergraph.graphql:/dist/schema/supergraph.graphql:ro
    command: >
      --config /dist/config/router.yaml
      --supergraph /dist/schema/supergraph.graphql
    depends_on:
      # service_started (not service_healthy) — Spring Boot containers have no
      # healthcheck; the router retries subgraph connections on its own once they
      # come up, so we only need the containers to exist before the router starts.
      shipment-service:
        condition: service_started
      route-service:
        condition: service_started
      carrier-service:
        condition: service_started
      warehouse-service:
        condition: service_started
    # No healthcheck: the Apollo Router image is distroless (no shell, curl, or
    # wget).  apollo-mcp-server uses service_started below and will restart until
    # the router is actually ready.

  # ── Apollo MCP Server ───────────────────────────────────────────────────────
  # Official image: ghcr.io/apollographql/apollo-mcp-server
  # Each .graphql file in apollo-mcp-server/operations/ becomes one MCP tool.
  # Hot-reload: edit/add files → tools update without restarting the container.
  apollo-mcp-server:
    image: ghcr.io/apollographql/apollo-mcp-server:latest
    container_name: sp-mcp
    restart: unless-stopped
    networks: [shipment-net]
    ports:
      - "8090:8000"   # MCP streamable-HTTP on 8000 inside, mapped to 8090 on host
    volumes:
      # config.yaml tells the server where to find operations and the schema
      - ./apollo-mcp-server/config.yaml:/config.yaml:ro
      # named .graphql files → each becomes one MCP tool (hot-reloaded)
      - ./apollo-mcp-server/operations:/mcp-operations:ro
      # composed supergraph schema produced by Rover
      - ./apollo-federation/supergraph.graphql:/supergraph/supergraph.graphql:ro
    command: ["/config.yaml"]
    depends_on:
      apollo-router:
        condition: service_started
    # No healthcheck: apollo-mcp-server image is also distroless (no curl/wget/sh).
    # fastapi-gateway uses service_started for this service and McpWorkbench
    # retries the MCP connection per request, so the gateway handles a slow start.

  # ── Prompt MCP Server (fastapi-mcp) ─────────────────────────────────────────
  # Serves versioned planning system prompts as MCP resources.
  # To change the active prompt:
  #   1. Add fastapi-mcp/prompts/planning_v2.txt
  #   2. Set ACTIVE_PLANNING_PROMPT=planning_v2 below (or in .env)
  #   3. docker compose restart fastapi-mcp   (no gateway redeploy needed)
  fastapi-mcp:
    build:
      context: ./fastapi-mcp
      dockerfile: Dockerfile
    container_name: sp-prompt-mcp
    restart: unless-stopped
    networks: [shipment-net]
    ports:
      - "8091:8091"
    environment:
      PORT: "8091"
      # Override to switch prompt version without rebuilding
      ACTIVE_PLANNING_PROMPT: ${ACTIVE_PLANNING_PROMPT:-planning_v1}
    volumes:
      # Mount prompts dir so you can add/edit .txt files without rebuilding
      - ./fastapi-mcp/prompts:/app/prompts:ro
    healthcheck:
      # MCP streamable-HTTP needs an initialize handshake before ping.
      # We just verify the server is listening: any HTTP response (not 000
      # which curl returns on connection refused) means the server is ready.
      test: >-
        curl -s -o /dev/null -w '%{http_code}'
        -X POST http://localhost:8091/mcp
        -H "Content-Type: application/json"
        -H "Accept: application/json, text/event-stream"
        -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"hc","version":"0"}}}'
        | grep -qE '^[1-5]'
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  # ── Redis (chat session store) ──────────────────────────────────────────────
  # Stores AutoGen conversation history per session with a configurable TTL
  # (default 1 h — set CHAT_SESSION_TTL in .env to override).
  # Sessions expire automatically; no manual cleanup needed.
  redis:
    image: redis:7-alpine
    container_name: sp-redis
    restart: unless-stopped
    networks: [shipment-net]
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── FastAPI Gateway (LangGraph + OpenRouter / Mistral AI) ───────────────────
  fastapi-gateway:
    build:
      context: ./fastapi-gateway
      dockerfile: Dockerfile
    container_name: sp-gateway
    restart: unless-stopped
    networks: [shipment-net]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Apollo MCP Server — GraphQL read tools (GetWarehouseCapacity, OptimizeRoute, …)
      MCP_SERVER_URL: http://apollo-mcp-server:8000/mcp
      GRAPHQL_ENDPOINT: http://apollo-router:4000/graphql
      # Prompt MCP Server — versioned system prompts (prompt://planning/current)
      PROMPT_MCP_SERVER_URL: http://fastapi-mcp:8091/mcp
      # ── LLM provider: "openrouter" (default) or "mistral" ──────────────────
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      # OpenRouter (used when LLM_PROVIDER=openrouter)
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      # OPENROUTER_API_KEY is read from .env
      # Mistral AI (used when LLM_PROVIDER=mistral)
      # MISTRAL_API_KEY and MISTRAL_MODEL are read from .env
      # ── Redis chat session store ────────────────────────────────────────────
      REDIS_URL: redis://redis:6379
      CHAT_SESSION_TTL: ${CHAT_SESSION_TTL:-3600}   # seconds; default 1 hour
    depends_on:
      apollo-mcp-server:
        condition: service_started   # distroless image — no healthcheck available
      fastapi-mcp:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── React UI ────────────────────────────────────────────────────────────────
  # Nginx serves the built React app on :3000.
  # /api/* is proxied to fastapi-gateway:8000 (avoids CORS, enables SSE).
  # Apollo Client points at /api/v1/graphql → FastAPI → Apollo Router.
  react-ui:
    build:
      context: ./react-ui
      dockerfile: Dockerfile
    container_name: sp-ui
    restart: unless-stopped
    networks: [shipment-net]
    ports:
      - "3000:80"
    depends_on:
      - fastapi-gateway

volumes:
  postgres-data:
  redis-data:

networks:
  shipment-net:
    driver: bridge